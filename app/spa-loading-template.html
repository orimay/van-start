<div data-testid="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif">
  <style>
    [data-testid=loading] { background: #fafaf9; color: #1c1917 }
    @media (prefers-color-scheme: dark) { [data-testid=loading] { background: #0c0a09; color: #f5f5f4 } }
    [data-testid=loading] i { width: 32px; height: 32px; border: 3px solid #ea580c55; border-top-color: #ea580c; border-radius: 50%; animation: spin 0.8s linear infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
  <i></i>
  <p style="margin:0">Loading…</p>
</div>
